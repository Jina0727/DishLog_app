name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon 2>&1 | tee build.log

      # 실패하면 컴파일 에러를 주석(annotation)으로 남겨서 로그를 안 열어도 보이게 해요.
      - name: Report errors
        if: failure()
        run: |
          msg=$(grep -E "^e: |error:|What went wrong" -A2 build.log | head -60 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
          echo "::error title=Build failed::$msg"

      - uses: actions/upload-artifact@v4
        with:
          name: Dishlog-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # 폰에서 바로 받을 수 있게 'latest' 릴리스에 APK 를 올려요 (매 빌드마다 교체).
      - name: Publish latest APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Dishlog.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Dishlog.apk \
            --title "Dishlog 최신 빌드 #${{ github.run_number }}" \
            --notes "커밋 ${GITHUB_SHA::7} 에서 빌드됨. 폰에서 Dishlog.apk 를 받아 설치하세요." \
            --prerelease
